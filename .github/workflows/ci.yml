name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Test curriculum, assessment and material import
        run: bun test src/lib

      - name: Check TypeScript and build production bundles
        run: bun run build

      - name: Install local Worker and browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/aiu-test-tools" --no-audit --no-fund playwright@1.56.1 wrangler@4.146.0
          "$RUNNER_TEMP/aiu-test-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Verify knowledge flow in a real Worker and browser
        run: node tests/knowledge-smoke.cjs
        env:
          AIU_TEST_TOOLS: ${{ runner.temp }}/aiu-test-tools

      - name: Save browser screenshots and verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: knowledge-browser-report
          path: app/test-results/
          retention-days: 7
          if-no-files-found: ignore
